<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110f">
<meta name="description" content="واجهة بليغ المحلية لإدارة مهام ومخزون وسجلات المزرعة.">
<title>بليغ | تشغيل المزرعة</title>
<style>
:root{color-scheme:dark;--bg:#07110f;--panel:#0d1a17;--panel2:#11231e;--line:#233a32;--text:#eef7f1;--muted:#91a79c;--green:#38d6a2;--green2:#167b5c;--amber:#f4c267;--red:#ff7777;--blue:#7bc8ff;--radius:18px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#183e31 0,transparent 50%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.shell{width:min(100%,1000px);margin:auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 18px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:44px;height:44px;border:1px solid #316b55;border-radius:15px;background:#123328;color:var(--green);font-size:23px}.brand h1{font-size:21px;margin:0}.brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #3c604d;border-radius:99px;padding:7px 10px;color:#b9f3d8;background:#10271e;font-size:10px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.notice{border:1px solid #5b4a2c;background:#211b10;color:#e9d2a4;padding:11px 13px;border-radius:13px;font-size:11px;margin-bottom:14px}
.hero{border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#122820,#0b1714 68%);padding:20px;margin-bottom:14px;overflow:hidden;position:relative}.eyebrow{font-size:10px;color:var(--green);letter-spacing:.12em;font-weight:800}.hero h2{font-size:clamp(23px,5vw,34px);line-height:1.25;margin:8px 0}.hero p{font-size:13px;color:var(--muted);max-width:620px;margin:0 0 16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{min-width:0}.spacer{flex:1}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--text);background:#12211c;font-size:12px}.btn:hover{border-color:#527866}.btn.primary{background:var(--green2);border-color:#269b73;color:#fff}.btn.danger{border-color:#733b3b;background:#321819;color:#ffd7d7}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
nav{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;margin-bottom:2px;scrollbar-width:thin}.navbtn{border:1px solid var(--line);background:#0c1814;color:var(--muted);padding:10px 13px;border-radius:12px;white-space:nowrap;font-size:12px}.navbtn.active{background:#16392b;border-color:#32865f;color:#d9ffec}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-width:0;border:1px solid var(--line);background:linear-gradient(145deg,#10201a,#0b1512);border-radius:var(--radius);padding:15px;margin-bottom:12px}.card h3{margin:0 0 12px;font-size:15px}.metric{padding:13px;border:1px solid #233b31;border-radius:15px;background:#0b1712}.metric strong{display:block;font-size:25px;line-height:1.2;margin-bottom:5px;font-variant-numeric:tabular-nums}.metric span{font-size:11px;color:var(--muted)}.metric.warn strong{color:var(--amber)}.metric.good strong{color:var(--green)}.muted{color:var(--muted)}.small{font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 1px 10px}.section-head h3{font-size:15px;margin:0}.section-head span{font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1713}.item-main{min-width:0;flex:1}.item h4{margin:0 0 4px;font-size:13px;overflow-wrap:anywhere}.item p{margin:0;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.tag{display:inline-block;border:1px solid #315141;color:#bce9d0;background:#11281c;padding:3px 7px;border-radius:99px;font-size:10px;margin-top:5px}.tag.warn{border-color:#66522d;color:#f6d48e;background:#28200f}.tag.bad{border-color:#713c3c;color:#ffc4c4;background:#2a1515}.empty{border:1px dashed #31463c;border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:12px}
.form-grid{display:grid;grid-template-columns:1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#b9c9c0}.field input,.field select,.field textarea,.chat-input{width:100%;min-width:0;border:1px solid #2a4036;border-radius:11px;background:#07110e;color:var(--text);padding:11px 12px;font-size:13px}.field textarea{min-height:76px;resize:vertical}.field input::placeholder,.field textarea::placeholder,.chat-input::placeholder{color:#65796e}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.divider{height:1px;background:var(--line);margin:14px 0}
.confirm{border:1px solid #79602c;background:linear-gradient(140deg,#2b2414,#17170f);border-radius:18px;padding:15px;margin:12px 0}.confirm h3{margin:0 0 7px;color:#f6d994;font-size:15px}.confirm p{font-size:12px;line-height:1.7;margin:0 0 12px;color:#e5d9b9;overflow-wrap:anywhere}
.log{display:flex;flex-direction:column;gap:8px}.message{padding:10px 12px;border-radius:14px;font-size:12px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{background:#163a2b;border:1px solid #2d634a;align-self:flex-start;max-width:95%}.message.bot{background:#0d1b16;border:1px solid var(--line);align-self:flex-end;max-width:95%}.message.system{align-self:stretch;border:1px dashed #32483c;color:#b5c6bb}
.voice-row{display:flex;align-items:center;gap:10px;margin-top:14px}.mic{width:48px;height:48px;border-radius:15px;border:1px solid #368561;background:#143b2b;color:#baffdf;font-size:21px}.mic.live{background:#5b2020;border-color:#b85252;color:#ffe2e2}.voice-status{font-size:11px;color:var(--muted)}
.chat{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);z-index:5}.chat-box{display:flex;gap:7px;padding:8px;border:1px solid #2b4538;background:#0a1511;border-radius:17px;box-shadow:0 12px 34px #0005}.chat-input{border:0;background:transparent;flex:1;padding:8px}.chat-box .btn{align-self:center}
.onboard-step{font-size:10px;color:var(--green);font-weight:800}.onboard-question{font-size:20px;line-height:1.45;margin:10px 0}.hint{font-size:11px;color:var(--muted);line-height:1.7}.footer{text-align:center;font-size:10px;color:#6f8277;padding:14px 0}
@media(min-width:650px){.shell{padding:22px 22px 36px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:26px}.grid{gap:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo" aria-hidden="true">🌾</div><div><h1>بليغ</h1><p>العقل التشغيلي للمزرعة</p></div></div><span class="pill"><span class="dot"></span><span id="status">جاهز</span></span></header>
<div class="notice"><strong>مهم:</strong> دي نسخة ويب محلية مستقلة. البيانات محفوظة في المتصفح ده فقط، ومش متصلة بقاعدة بيانات تطبيق Android ولا بتتزامن معاه.</div>
<div id="app" aria-live="polite"></div>
<div class="footer">بليغ • لا تُسجّل أي عملية مهمة قبل مراجعة التأكيد.</div>
</div>
<script>
(function(){
'use strict';
const STORE='balegh_web_v4';
const LEGACY='balegh_personal_v3';
const root=document.getElementById('app');
const statusEl=document.getElementById('status');
const onboardingSteps=[
 {key:'name',label:'اسمك إيه؟',hint:'الاسم للتعامل في المحادثة فقط.'},
 {key:'farmName',label:'اسم المزرعة أو المكان إيه؟',hint:'تقدر تتخطى السؤال وتكمله بعدين.'},
 {key:'location',label:'المزرعة فين؟',hint:'اكتب القرية أو المركز أو المحافظة.'},
 {key:'lands',label:'تقريباً كام أرض أو قطعة عندك؟',hint:'ده تقدير وصفي، مش سجل أراضٍ رسمي.'},
 {key:'crops',label:'إيه المحاصيل الأساسية؟',hint:'اكتب المحاصيل الموجودة حالياً.'},
 {key:'workerEstimate',label:'عندك كام عامل تقريباً؟',hint:'العدد ده تقديري فقط. مش هيتحول لأسماء عمال وهمية.'},
 {key:'livestock',label:'عندك حيوانات أو مواشي؟',hint:'قول الأنواع لو موجودة، أو اكتب مفيش.'},
 {key:'equipment',label:'إيه المعدات المهمة؟',hint:'زي الطلمبات والجرار ومعدات الري.'},
 {key:'inventoryDescription',label:'إيه أهم أصناف المخزن؟',hint:'الوصف ده مش هيغير الرصيد. سجّل الأصناف الفعلية من صفحة المخزون.'},
 {key:'priorities',label:'إيه أهم حاجة تحب بليغ يركز عليها؟',hint:'مثلاً متابعة الري أو المصاريف أو العمال.'}
];
function blankState(){return {profile:{name:'',farmName:'',location:'',lands:'',crops:'',workerEstimate:'',livestock:'',equipment:'',inventoryDescription:'',priorities:'',complete:false,onboardingStep:0},workers:[],inventory:[],movements:[],tasks:[],finance:[],attendance:[],events:[],memory:[],notes:[]};}
function isGeneratedWorker(w,i){return /^عامل\s+\d+$/.test(String(w.name||''))&&/^W\d+$/.test(String(w.code||''))&&String(w.job||'')==='عامل';}
function loadState(){
 let raw=null,source=STORE;
 try{raw=localStorage.getItem(STORE);if(!raw){raw=localStorage.getItem(LEGACY);source=LEGACY;}if(!raw)return blankState();const saved=JSON.parse(raw);const base=blankState();const result=Object.assign(base,saved||{});result.profile=Object.assign(base.profile,saved.profile||{});for(const key of ['workers','inventory','movements','tasks','finance','attendance','events','memory','notes'])if(!Array.isArray(result[key]))result[key]=[];
 if(source===LEGACY){
   if(result.workers.length&&result.workers.every(isGeneratedWorker)){result.workers=[];result.events.unshift({type:'system',text:'تم استبعاد أسماء العمال الافتراضية التي أنشأها الإعداد القديم. سجّل العمال الحقيقيين من صفحة العمال.',time:Date.now()});}
   result.profile.workerEstimate=result.profile.workerEstimate||result.profile.workers||'';
   result.profile.inventoryDescription=result.profile.inventoryDescription||result.profile.inventory||'';
   result.profile.onboardingStep=Number(result.profile.onboardingStep)||0;
   result.inventory=result.inventory.map(function(x){return Object.assign({},x,{qty:Number(x.qty??x.currentBalance??0),min:Number(x.min??x.minThreshold??0),unit:x.unit||'وحدة'});});
   result.tasks=result.tasks.map(function(x){return Object.assign({},x,{id:x.id||makeId(),date:x.date||today()});});
   result.movements=result.movements||[];
 }
 return result;
 }catch(e){return blankState();}
}
let state=loadState(),view='home',pendingAction=null,listening=false,recognition=null,busy=false;
function makeId(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(value){return Number(value||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';}
function qty(item){return Number(item.qty??item.currentBalance??0);}
function minimum(item){return Number(item.min??item.minThreshold??0);}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));statusEl.textContent='تم الحفظ محلياً';return true;}catch(e){statusEl.textContent='تعذر الحفظ';return false;}}
function addEvent(type,text){state.events.push({type:type,text:String(text),time:Date.now()});state.events=state.events.slice(-160);save();}
function speak(text){if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='ar-EG';u.rate=.94;window.speechSynthesis.speak(u);}catch(e){}}
function notify(text){statusEl.textContent=text;setTimeout(function(){if(statusEl.textContent===text)statusEl.textContent='جاهز';},2600);}
function workerByCode(code){return state.workers.find(function(w){return w.code===code;});}
function nav(){return '<nav aria-label="أقسام المزرعة">'+[['home','الرئيسية'],['tasks','المهام'],['inventory','المخزون'],['workers','العمال'],['finance','المالية'],['memory','بيانات المزرعة'],['activity','السجل']].map(function(x){return '<button class="navbtn '+(view===x[0]?'active':'')+'" data-action="navigate" data-view="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</nav>';}
function metric(value,label,extra){return '<div class="metric '+(extra||'')+'"><strong>'+esc(value)+'</strong><span>'+esc(label)+'</span></div>';}
function empty(text){return '<div class="empty">'+esc(text)+'</div>';}
function taskCard(t){const assigned=t.workerName||workerByCode(t.workerCode)?.name||'غير مسند';return '<div class="item"><div class="item-main"><h4>'+esc(t.taskName||t.title||'مهمة بدون عنوان')+'</h4><p>التاريخ: '+esc(t.date||'غير محدد')+' • المسؤول: '+esc(assigned)+'</p><span class="tag '+(t.status==='مكتملة'?'':'warn')+'">'+esc(t.status||'مفتوحة')+'</span></div><button class="btn" data-action="toggle-task" data-id="'+esc(t.id)+'">'+(t.status==='مكتملة'?'إعادة فتح':'إكمال')+'</button></div>';}
function inventoryCard(x){const low=qty(x)<=minimum(x);return '<div class="item"><div class="item-main"><h4>'+esc(x.name||'صنف بدون اسم')+'</h4><p>الكود: '+esc(x.code||'—')+' • الحد الأدنى: '+esc(minimum(x))+' '+esc(x.unit||'وحدة')+'</p><span class="tag '+(low?'warn':'')+'">'+esc(qty(x))+' '+esc(x.unit||'وحدة')+(low?' • مخزون منخفض':' • الرصيد الحالي')+'</span></div></div>';}
function workerCard(w){const attended=state.attendance.some(function(a){return a.workerCode===w.code&&a.date===today()&&a.status==='حاضر';});return '<div class="item"><div class="item-main"><h4>'+esc(w.name)+'</h4><p>'+esc(w.job||'بدون وظيفة')+' • كود '+esc(w.code)+'</p><span class="tag">'+(attended?'تم تسجيل الحضور اليوم':'لم يسجل الحضور اليوم')+'</span></div><button class="btn" data-action="attendance" data-code="'+esc(w.code)+'" '+(attended?'disabled':'')+'>إثبات حضور</button></div>';}
function financeCard(f){return '<div class="item"><div class="item-main"><h4>'+esc(f.description||'حركة مالية')+'</h4><p>'+esc(f.date||'')+' • '+esc(f.type||'')+'</p></div><strong class="'+(f.type==='دخل'?'g':'')+'">'+esc(money(f.amount))+'</strong></div>';}
function renderOnboarding(){const step=Math.min(Number(state.profile.onboardingStep)||0,onboardingSteps.length-1);const item=onboardingSteps[step];root.innerHTML='<section class="hero"><div class="eyebrow">إعداد بليغ • '+(step+1)+' من '+onboardingSteps.length+'</div><h2>خلينا نتعرف على المزرعة خطوة خطوة</h2><p>هحفظ المعلومات اللي تقولها، وتقدر تتخطى أي سؤال. الأوصاف والأعداد التقريبية مش هتتحول لسجلات عمال أو مخزون من غير تسجيل فعلي.</p><div class="divider"></div><div class="onboard-step">السؤال الحالي</div><h3 class="onboard-question">'+esc(item.label)+'</h3><p class="hint">'+esc(item.hint)+'</p><form data-form="onboarding"><div class="field"><label for="answer">إجابتك</label><input id="answer" name="answer" autocomplete="off" placeholder="اكتب إجابتك هنا"></div><div class="form-actions"><button class="btn primary" type="submit">حفظ ومتابعة</button><button class="btn" type="button" data-action="skip-onboarding">تخطي للسؤال التالي</button><button class="btn ghost" type="button" data-action="finish-onboarding">إنهاء الإعداد الآن</button></div></form><div class="voice-row"><button class="mic '+(listening?'live':'')+'" data-action="toggle-voice" aria-label="التحدث">'+(listening?'■':'🎙️')+'</button><span class="voice-status">'+(listening?'بليغ يستمع الآن':'تقدر تجاوب بالصوت إذا كان المتصفح يدعم التعرف على الكلام')+'</span></div></section><section class="card"><h3>المعلومات التي تم حفظها</h3><div class="list">'+state.events.filter(function(e){return e.type==='user'||e.type==='bot'||e.type==='system';}).slice(-5).map(function(e){return '<div class="message '+(e.type==='user'?'user':e.type==='system'?'system':'bot')+'">'+esc(e.text)+'</div>';}).join('')+'</div></section>';}
function renderHome(){const open=state.tasks.filter(function(t){return t.status!=='مكتملة';}).length;const low=state.inventory.filter(function(x){return qty(x)<=minimum(x);}).length;const income=state.finance.filter(function(x){return x.type==='دخل';}).reduce(function(a,x){return a+Number(x.amount||0);},0);const expenses=state.finance.filter(function(x){return x.type==='مصروف';}).reduce(function(a,x){return a+Number(x.amount||0);},0);return '<section class="hero"><div class="eyebrow">تشغيل المزرعة • لوحة المتابعة</div><h2">'+esc(state.profile.farmName||'مزرعتك')+'</h2><p>واجهة واحدة لمتابعة السجلات المحلية. استخدم الصوت أو الأزرار، وكل تغيير مهم هيظهر لك للتأكيد قبل الحفظ.</p><div class="voice-row"><button class="mic '+(listening?'live':'')+'" data-action="toggle-voice" aria-label="ابدأ التحدث">'+(listening?'■':'🎙️')+'</button><span class="voice-status">'+(listening?'بليغ يستمع الآن':'اضغط للتحدث أو اكتب طلبك في الأسفل')+'</span><span class="spacer"></span><button class="btn" data-action="navigate" data-view="tasks">إضافة مهمة</button></div></section><div class="grid four">'+metric(open,'مهام مفتوحة')+metric(state.workers.length,'عمال مسجلون')+metric(low,'أصناف عند الحد الأدنى',low?'warn':'')+metric(money(income-expenses),'صافي الحركات المسجلة',(income-expenses)<0?'warn':'good')+'</div><div class="section-head"><h3>المهام القادمة</h3><button class="btn" data-action="navigate" data-view="tasks">عرض الكل</button></div><section class="card"><div class="list">'+(state.tasks.filter(function(t){return t.status!=='مكتملة';}).slice(0,4).map(taskCard).join('')||empty('لا توجد مهام مفتوحة مسجلة.'))+'</div></section><div class="section-head"><h3>حالة المخزون</h3><button class="btn" data-action="navigate" data-view="inventory">إدارة المخزون</button></div><section class="card"><div class="list">'+(state.inventory.filter(function(x){return qty(x)<=minimum(x);}).slice(0,4).map(inventoryCard).join('')||empty(state.inventory.length?'لا توجد أصناف عند الحد الأدنى حالياً.':'لا توجد أصناف مخزون مسجلة بعد.'))+'</div></section><div class="section-head"><h3>آخر النشاطات</h3><button class="btn" data-action="navigate" data-view="activity">السجل الكامل</button></div><section class="card"><div class="list">'+(state.events.slice(-4).reverse().map(function(e){return '<div class="message '+(e.type==='user'?'user':e.type==='system'?'system':'bot')+'">'+esc(e.text)+'</div>';}).join('')||empty('لا توجد نشاطات مسجلة.'))+'</div></section>';}
function renderTasks(){return '<section class="hero"><div class="eyebrow">إدارة التنفيذ</div><h2>المهام</h2><p>كل مهمة جديدة أو تغيير حالة يحتاج تأكيدك قبل حفظه.</p></section><section class="card"><h3>إضافة مهمة</h3><form data-form="task-add"><div class="form-grid two"><div class="field"><label>وصف المهمة</label><input name="taskName" required maxlength="180" placeholder="مثلاً: ري الأرض الغربية"></div><div class="field"><label>التاريخ</label><input type="date" name="date" value="'+today()+'" required></div><div class="field"><label>المسؤول (اختياري)</label><select name="workerCode"><option value="">غير مسند</option>'+state.workers.map(function(w){return '<option value="'+esc(w.code)+'">'+esc(w.name)+' — '+esc(w.code)+'</option>';}).join('')+'</select></div><div class="field"><label>ملاحظات</label><input name="notes" maxlength="250" placeholder="تفاصيل إضافية"></div></div><div class="form-actions"><button class="btn primary" type="submit">مراجعة المهمة</button></div></form></section><section class="card"><h3>كل المهام ('+state.tasks.length+')</h3><div class="list">'+(state.tasks.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).map(taskCard).join('')||empty('لا توجد مهام مسجلة.'))+'</div></section>';}
function renderInventory(){return '<section class="hero"><div class="eyebrow">الرصيد والحركة</div><h2>المخزون</h2><p>وصف المخزون أثناء الإعداد لا يغيّر الرصيد. سجّل كل صنف وكمية فعلية أولاً، ثم سجل الإضافة أو الصرف بتأكيد منفصل.</p></section><section class="card"><h3>تسجيل صنف فعلي</h3><form data-form="inventory-add"><div class="form-grid two"><div class="field"><label>اسم الصنف</label><input name="name" required maxlength="100" placeholder="مثلاً: سماد يوريا"></div><div class="field"><label>كود الصنف</label><input name="code" required maxlength="30" placeholder="مثلاً: INV-001"></div><div class="field"><label>وحدة القياس</label><input name="unit" required maxlength="30" placeholder="شكارة، كيلو، لتر"></div><div class="field"><label>الرصيد الافتتاحي</label><input name="qty" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>حد التنبيه الأدنى</label><input name="min" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>مكان التخزين</label><input name="location" maxlength="100" placeholder="المخزن الرئيسي"></div></div><div class="form-actions"><button class="btn primary" type="submit">مراجعة الصنف</button></div></form></section><section class="card"><h3>تسجيل حركة مخزون</h3><form data-form="stock-adjust"><div class="form-grid two"><div class="field"><label>الصنف</label><select name="code" required><option value="">اختر صنفاً مسجلاً</option>'+state.inventory.map(function(x){return '<option value="'+esc(x.code)+'">'+esc(x.name)+' • رصيد '+esc(qty(x))+' '+esc(x.unit||'')+'</option>';}).join('')+'</select></div><div class="field"><label>نوع الحركة</label><select name="direction"><option value="in">إضافة / استلام</option><option value="out">صرف / استهلاك</option></select></div><div class="field"><label>الكمية</label><input name="quantity" type="number" min="0.01" step="0.01" required></div><div class="field"><label>السبب</label><input name="reason" maxlength="180" placeholder="سبب الحركة" required></div></div><div class="form-actions"><button class="btn primary" type="submit" '+(state.inventory.length?'':'disabled')+'>مراجعة الحركة</button></div></form></section><section class="card"><h3>الأصناف المسجلة ('+state.inventory.length+')</h3><div class="list">'+(state.inventory.map(inventoryCard).join('')||empty('لا يوجد مخزون مسجل. أضف صنفاً فعلياً من النموذج أعلاه.'))+'</div></section>';}
function renderWorkers(){return '<section class="hero"><div class="eyebrow">الأفراد والحضور</div><h2>العمال</h2><p>العدد التقريبي الذي قيل أثناء الإعداد لا يُنشئ عمالاً تلقائياً. السجل هنا للعمال الذين أضفتهم بنفسك.</p></section><section class="card"><h3>تسجيل عامل</h3><form data-form="worker-add"><div class="form-grid two"><div class="field"><label>اسم العامل</label><input name="name" required maxlength="100"></div><div class="field"><label>كود العامل</label><input name="code" required maxlength="30" placeholder="W-001"></div><div class="field"><label>الوظيفة</label><input name="job" maxlength="80" placeholder="عامل زراعي"></div><div class="field"><label>الأجر اليومي (اختياري)</label><input name="dailyRate" type="number" min="0" step="0.01" value="0"></div></div><div class="form-actions"><button class="btn primary" type="submit">مراجعة بيانات العامل</button></div></form></section><section class="card"><h3>سجل العمال ('+state.workers.length+')</h3><div class="list">'+(state.workers.map(workerCard).join('')||empty('لا توجد أسماء عمال فعلية مسجلة.'))+'</div><div class="divider"></div><h3>حضور اليوم</h3><p class="small muted">تسجيل الحضور يحتاج تأكيداً، ولا يُسمح بتسجيل نفس العامل مرتين في اليوم.</p><div class="list">'+(state.workers.map(function(w){const a=state.attendance.find(function(x){return x.workerCode===w.code&&x.date===today();});return '<div class="item"><div class="item-main"><h4>'+esc(w.name)+'</h4><p>'+esc(a?a.status:'لم يسجل بعد')+'</p></div></div>';}).join('')||empty('أضف العمال الحقيقيين أولاً.'))+'</div></section>';}
function renderFinance(){const income=state.finance.filter(function(x){return x.type==='دخل';}).reduce(function(a,x){return a+Number(x.amount||0);},0);const expense=state.finance.filter(function(x){return x.type==='مصروف';}).reduce(function(a,x){return a+Number(x.amount||0);},0);return '<section class="hero"><div class="eyebrow">سجل مالي محلي</div><h2>المالية</h2><p>دي حركات مالية أُدخلت في نسخة الويب المحلية فقط، وليست قراءة من الخزينة داخل تطبيق Android.</p></section><div class="grid">'+metric(money(income),'إجمالي الدخل','good')+metric(money(expense),'إجمالي المصروف','warn')+'</div><section class="card"><h3>إضافة حركة مالية</h3><form data-form="finance-add"><div class="form-grid two"><div class="field"><label>نوع الحركة</label><select name="type"><option value="مصروف">مصروف</option><option value="دخل">دخل</option></select></div><div class="field"><label>المبلغ بالجنيه</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>الوصف</label><input name="description" maxlength="180" required placeholder="مثلاً: شراء وقود"></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>طريقة الدفع (اختياري)</label><input name="method" maxlength="80" placeholder="غير محدد"></div></div><div class="form-actions"><button class="btn primary" type="submit">مراجعة الحركة</button></div></form></section><section class="card"><h3>الحركات المسجلة ('+state.finance.length+')</h3><div class="list">'+(state.finance.slice().reverse().map(financeCard).join('')||empty('لا توجد حركات مالية مسجلة.'))+'</div></section>';}
function renderMemory(){const p=state.profile;return '<section class="hero"><div class="eyebrow">الذاكرة والإعدادات</div><h2>بيانات المزرعة</h2><p>الحقائق هنا وصفية. تسجيل الأراضي والمحاصيل والمعدات الفعلية داخل قاعدة Android ما زال منفصلاً عن هذه النسخة.</p><div class="row"><button class="btn" data-action="export">تصدير نسخة احتياطية</button><button class="btn danger" data-action="reset">إعادة ضبط بيانات نسخة الويب</button></div></section><section class="card"><h3>تعديل معلومات المزرعة</h3><form data-form="profile-update"><div class="form-grid two"><div class="field"><label>اسم المالك</label><input name="name" value="'+esc(p.name)+'" maxlength="100"></div><div class="field"><label>اسم المزرعة</label><input name="farmName" value="'+esc(p.farmName)+'" maxlength="100"></div><div class="field"><label>الموقع</label><input name="location" value="'+esc(p.location)+'" maxlength="150"></div><div class="field"><label>المحاصيل (وصف)</label><input name="crops" value="'+esc(p.crops)+'" maxlength="250"></div><div class="field"><label>الأولوية الحالية</label><input name="priorities" value="'+esc(p.priorities)+'" maxlength="250"></div><div class="field"><label>عدد العمال التقريبي (وصف فقط)</label><input name="workerEstimate" value="'+esc(p.workerEstimate||p.workers||'')+'" maxlength="80"></div></div><div class="form-actions"><button class="btn primary" type="submit">مراجعة التغييرات</button></div></form></section><section class="card"><h3>معلومات محفوظة</h3><div class="list">'+[['الأراضي (وصف)',p.lands],['المواشي (وصف)',p.livestock],['المعدات (وصف)',p.equipment],['المخزون (وصف)',p.inventoryDescription||p.inventory],['الأولوية',p.priorities]].map(function(x){return '<div class="item"><div class="item-main"><h4>'+esc(x[0])+'</h4><p>'+esc(x[1]||'لم يتم تحديدها')+'</p></div></div>';}).join('')+'</div></section>';}
function renderActivity(){return '<section class="hero"><div class="eyebrow">سجل المراجعة</div><h2>النشاطات</h2><p>تظهر هنا الرسائل ونتائج التغييرات التي تمت داخل نسخة الويب المحلية.</p></section><section class="card"><div class="list">'+(state.events.slice().reverse().map(function(e){const time=e.time?new Date(e.time).toLocaleString('ar-EG'):'—';return '<div class="item"><div class="item-main"><h4>'+esc(e.text)+'</h4><p>'+esc(time)+' • '+esc(e.type)+'</p></div></div>';}).join('')||empty('لا توجد نشاطات مسجلة.'))+'</div></section>';}
function renderPending(){if(!pendingAction)return '';return '<section class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h3 id="confirm-title">تأكيد قبل الحفظ</h3><p>'+esc(pendingAction.summary)+'</p><div class="row"><button class="btn primary" data-action="confirm-yes">تأكيد التنفيذ</button><button class="btn" data-action="confirm-no">إلغاء</button></div></section>';}
function renderChat(){return '<section class="card"><div class="section-head" style="margin-top:0"><h3>محادثة بليغ</h3><span>صوت أو كتابة</span></div><div class="log">'+state.events.filter(function(e){return ['user','bot','system'].includes(e.type);}).slice(-6).map(function(e){return '<div class="message '+(e.type==='user'?'user':e.type==='system'?'system':'bot')+'">'+esc(e.text)+'</div>';}).join('')+'</div><div class="hint" style="margin-top:9px">الأوامر المتاحة في نسخة الويب: قراءة ملخص المهام أو المخزون أو العمال أو الحركات المالية، وطلب تسجيل مهمة أو حركة مالية. باقي الأوامر تحتاج تطبيق Android.</div></section><div class="chat"><form class="chat-box" data-form="chat"><input class="chat-input" name="text" id="chatText" autocomplete="off" placeholder="اكتب طلبك لبليغ..." aria-label="رسالة لبليغ"><button class="btn primary" type="submit">إرسال</button></form></div>';}
function render(){if(!state.profile.complete){renderOnboarding();return;}const pages={home:renderHome,tasks:renderTasks,inventory:renderInventory,workers:renderWorkers,finance:renderFinance,memory:renderMemory,activity:renderActivity};root.innerHTML=nav()+(pages[view]||renderHome)()+renderPending()+renderChat();}
function requestAction(action){if(pendingAction){notify('فيه إجراء منتظر التأكيد بالفعل.');return;}pendingAction=action;render();const dialog=root.querySelector('[role="dialog"]');if(dialog&&dialog.scrollIntoView)dialog.scrollIntoView({behavior:'smooth',block:'center'});}
function cancelPending(){pendingAction=null;addEvent('system','تم إلغاء الإجراء ولم يتم حفظ أي تغيير.');render();}
function applyAction(a){
 const p=a.payload||{};
 if(a.kind==='task.add'){const worker=p.workerCode?workerByCode(p.workerCode):null;if(p.workerCode&&!worker)throw Error('العامل المختار غير موجود.');state.tasks.push({id:makeId(),taskName:p.taskName.trim(),date:p.date||today(),workerCode:worker?worker.code:'',workerName:worker?worker.name:'غير مسند',notes:p.notes||'',status:'مفتوحة',createdAt:Date.now()});view='tasks';return 'تم حفظ المهمة في سجل نسخة الويب المحلية: '+p.taskName+'.';}
 if(a.kind==='task.toggle'){const t=state.tasks.find(function(x){return String(x.id)===String(p.id);});if(!t)throw Error('المهمة لم تعد موجودة.');t.status=t.status==='مكتملة'?'مفتوحة':'مكتملة';t.completedAt=t.status==='مكتملة'?Date.now():null;view='tasks';return 'تم تحديث حالة المهمة إلى '+t.status+'.';}
 if(a.kind==='inventory.add'){if(state.inventory.some(function(x){return x.code.toLowerCase()===p.code.toLowerCase()||x.name.toLowerCase()===p.name.toLowerCase();}))throw Error('يوجد صنف مسجل بنفس الاسم أو الكود.');state.inventory.push({code:p.code.trim(),name:p.name.trim(),unit:p.unit.trim(),qty:Number(p.qty),min:Number(p.min),location:p.location||'',createdAt:Date.now()});view='inventory';return 'تم تسجيل الصنف '+p.name+' بالرصيد الافتتاحي '+p.qty+' '+p.unit+'.';}
 if(a.kind==='stock.adjust'){const item=state.inventory.find(function(x){return x.code===p.code;});if(!item)throw Error('الصنف غير موجود في السجل.');const amount=Number(p.quantity);const delta=p.direction==='in'?amount:-amount;if(!Number.isFinite(amount)||amount<=0)throw Error('الكمية غير صالحة.');if(qty(item)+delta<0)throw Error('الرصيد لا يكفي للصرف. لم يتغير المخزون.');item.qty=qty(item)+delta;state.movements.push({id:makeId(),itemCode:item.code,date:today(),direction:p.direction,quantity:amount,reason:p.reason,createdAt:Date.now()});view='inventory';return 'تم تسجيل حركة '+(p.direction==='in'?'إضافة':'صرف')+' مقدارها '+amount+' '+item.unit+' للصنف '+item.name+'. الرصيد الجديد '+item.qty+'.';}
 if(a.kind==='worker.add'){if(state.workers.some(function(w){return w.code.toLowerCase()===p.code.toLowerCase();}))throw Error('كود العامل مسجل بالفعل.');state.workers.push({code:p.code.trim(),name:p.name.trim(),job:p.job||'غير محدد',dailyRate:Number(p.dailyRate||0),status:'نشط',createdAt:Date.now()});view='workers';return 'تم تسجيل العامل '+p.name+'.';}
 if(a.kind==='attendance'){const w=workerByCode(p.code);if(!w)throw Error('العامل غير موجود.');if(state.attendance.some(function(x){return x.workerCode===w.code&&x.date===today();}))throw Error('تم تسجيل حضور العامل اليوم بالفعل.');state.attendance.push({id:makeId(),workerCode:w.code,workerName:w.name,date:today(),status:'حاضر',createdAt:Date.now()});view='workers';return 'تم تسجيل حضور '+w.name+' بتاريخ '+today()+'.';}
 if(a.kind==='finance.add'){const amount=Number(p.amount);if(!Number.isFinite(amount)||amount<=0)throw Error('المبلغ لازم يكون أكبر من صفر.');state.finance.push({id:makeId(),type:p.type,amount:amount,description:p.description.trim(),date:p.date||today(),method:p.method||'غير محدد',createdAt:Date.now()});view='finance';return 'تم تسجيل '+p.type+' بقيمة '+money(amount)+' في نسخة الويب المحلية.';}
 if(a.kind==='profile.update'){state.profile=Object.assign({},state.profile,p);return 'تم تحديث بيانات المزرعة الوصفية.';}
 if(a.kind==='reset'){state=blankState();view='home';localStorage.removeItem(STORE);localStorage.removeItem(LEGACY);save();return 'تمت إعادة ضبط بيانات نسخة الويب المحلية فقط.';}
 throw Error('نوع الإجراء غير معروف.');
}
function confirmPending(yes){if(!pendingAction)return;const action=pendingAction;pendingAction=null;if(!yes){addEvent('system','تم إلغاء الإجراء ولم يتم حفظ أي تغيير.');render();return;}try{const result=applyAction(action);addEvent('system',result);save();render();speak(result);}catch(e){addEvent('system','لم يتم الحفظ: '+(e.message||'حدث خطأ'));save();render();notify('لم يتم الحفظ');}}
function normalizeDigits(text){return String(text).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);});}
function answerOnboarding(text){const idx=Number(state.profile.onboardingStep)||0;const item=onboardingSteps[idx];if(!item){state.profile.complete=true;save();render();return;}const value=String(text||'').trim();if(!value){addEvent('bot','اكتب إجابة أو اضغط تخطي للسؤال التالي.');render();return;}addEvent('user',value);if(item.key==='workerEstimate')state.profile.workerEstimate=value;else state.profile[item.key]=value;state.profile.onboardingStep=idx+1;if(idx+1>=onboardingSteps.length){state.profile.complete=true;addEvent('bot','تم حفظ المعلومات الوصفية. لم أنشئ سجلات عمال أو مخزون من الأعداد والأوصاف التقريبية. تقدر تبدأ بإضافة السجلات الفعلية.');view='home';}else addEvent('bot','تم حفظ الإجابة. '+onboardingSteps[idx+1].label);save();render();speak(state.events[state.events.length-1].text);}
function skipOnboarding(finish){const idx=Number(state.profile.onboardingStep)||0;if(finish){state.profile.complete=true;view='home';addEvent('system','تم إنهاء الإعداد. تقدر تكمل المعلومات من صفحة بيانات المزرعة.');}else{state.profile.onboardingStep=Math.min(idx+1,onboardingSteps.length);if(state.profile.onboardingStep>=onboardingSteps.length){state.profile.complete=true;view='home';addEvent('system','انتهى الإعداد. تقدر تكمل المعلومات من صفحة بيانات المزرعة.');}else addEvent('system','تم تخطي السؤال: '+onboardingSteps[idx].label);}save();render();}
function reply(text){addEvent('bot',text);save();render();speak(text);}
function processInput(raw){const text=String(raw||'').trim();if(!text||busy)return;addEvent('user',text);if(!state.profile.complete){answerOnboarding(text);return;}const t=normalizeDigits(text).toLowerCase();
 if(/المخزن|المخزون|ناقص|رصيد/.test(t)){const low=state.inventory.filter(function(x){return qty(x)<=minimum(x);});reply(state.inventory.length?'عدد الأصناف المسجلة '+state.inventory.length+'. '+(low.length?'عند الحد الأدنى أو أقل: '+low.map(function(x){return x.name+' ('+qty(x)+' '+x.unit+')';}).join('، '):'لا توجد أصناف عند الحد الأدنى حسب السجلات المحلية.'):'لا توجد أصناف مخزون مسجلة في نسخة الويب. لم أستنتج أرصدة من الوصف أثناء الإعداد.');view='inventory';render();return;}
 if(/مهام|مهمة|العمل المطلوب/.test(t)&&!/سجل مهمة|اعمل مهمة|ضيف مهمة|اضف مهمة/.test(t)){reply(state.tasks.length?'عدد المهام '+state.tasks.length+'، المفتوح '+state.tasks.filter(function(x){return x.status!=='مكتملة';}).length+'، المكتمل '+state.tasks.filter(function(x){return x.status==='مكتملة';}).length+'.':'لا توجد مهام مسجلة في نسخة الويب.');view='tasks';render();return;}
 if(/عمال|عامل|حضور/.test(t)){reply(state.workers.length?'عدد العمال المسجلين فعلياً '+state.workers.length+'. الحضور المسجل اليوم '+state.attendance.filter(function(a){return a.date===today()&&a.status==='حاضر';}).length+'.':'لا توجد سجلات عمال فعلية. العدد التقريبي أثناء الإعداد لا ينشئ عمالاً.');view='workers';render();return;}
 if(/فلوس|مالية|مصروف|دخل|مبيعات|الخزينة/.test(t)&&!/سجل مصروف|سجل دخل|ضيف مصروف|اضف مصروف/.test(t)){const inc=state.finance.filter(function(x){return x.type==='دخل';}).reduce(function(a,x){return a+Number(x.amount||0);},0);const out=state.finance.filter(function(x){return x.type==='مصروف';}).reduce(function(a,x){return a+Number(x.amount||0);},0);reply('الحركات المحلية المسجلة: دخل '+money(inc)+'، مصروف '+money(out)+'، صافي '+money(inc-out)+'. هذه ليست بيانات الخزينة في تطبيق Android.');view='finance';render();return;}
 if(/^(سجل مهمة|اعمل مهمة|ضيف مهمة|اضف مهمة)/.test(t)){const taskName=text.replace(/^(سجل مهمة|اعمل مهمة|ضيف مهمة|اضف مهمة)\s*/i,'').trim();if(!taskName){reply('اكتب وصف المهمة، أو افتح صفحة المهام لتحديد التاريخ والمسؤول.');view='tasks';render();return;}requestAction({kind:'task.add',summary:'إنشاء مهمة: '+taskName+'. التاريخ: '+(/بكرة|غدا|غداً/.test(t)?tom():today())+'. المسؤول غير مسند ما لم تختر عاملاً مسجلاً.',payload:{taskName:taskName,date:/بكرة|غدا|غداً/.test(t)?tom():today(),workerCode:'',notes:'تم الطلب عبر محادثة الويب'}});return;}
 if(/^(سجل مصروف|ضيف مصروف|اضف مصروف|سجل دخل)/.test(t)){const m=t.match(/([0-9]+(?:[.,][0-9]+)?)\s*(?:جنيه|ج|جنيهات)/);if(!m){reply('اذكر المبلغ بالجنيه، مثلاً: سجل مصروف وقود 350 جنيه.');view='finance';render();return;}const amount=Number(m[1].replace(',','.'));const type=/دخل/.test(t)?'دخل':'مصروف';const description=text.replace(/^(سجل مصروف|ضيف مصروف|اضف مصروف|سجل دخل)\s*/i,'').replace(m[0],'').trim()||type;requestAction({kind:'finance.add',summary:'تسجيل '+type+' بقيمة '+money(amount)+' — الوصف: '+description+'. التاريخ: '+today()+'.',payload:{type:type,amount:amount,description:description,date:today(),method:'غير محدد'}});return;}
 reply('أقدر في نسخة الويب أقرأ ملخص السجلات المحلية وأطلب تسجيل مهمة أو حركة مالية. لم أنفذ أي تغيير لأن الطلب مش واضح كإجراء مدعوم هنا. استخدم صفحات المهام والمخزون والعمال والمالية للأوامر الأخرى.');}
function submitForm(form){const fd=new FormData(form);const p=Object.fromEntries(fd.entries());const type=form.dataset.form;
 if(type==='onboarding'){answerOnboarding(p.answer);return;}
 if(type==='chat'){processInput(p.text);form.reset();return;}
 if(type==='task-add'){const name=String(p.taskName||'').trim();if(!name){notify('اكتب وصف المهمة');return;}const worker=p.workerCode?workerByCode(p.workerCode):null;requestAction({kind:'task.add',summary:'إنشاء مهمة باسم: '+name+'، التاريخ '+p.date+'، المسؤول '+(worker?worker.name:'غير مسند')+(p.notes?'، ملاحظات: '+p.notes:''),payload:p});return;}
 if(type==='inventory-add'){if(!p.name.trim()||!p.code.trim()||!p.unit.trim()){notify('أكمل اسم الصنف والكود والوحدة');return;}if(Number(p.qty)<0||Number(p.min)<0){notify('الكميات لا يمكن أن تكون سالبة');return;}requestAction({kind:'inventory.add',summary:'إضافة صنف مخزون: '+p.name+'، الكود '+p.code+'، الرصيد الافتتاحي '+p.qty+' '+p.unit+'، الحد الأدنى '+p.min+'.',payload:p});return;}
 if(type==='stock-adjust'){if(!p.code||!Number.isFinite(Number(p.quantity))||Number(p.quantity)<=0||!String(p.reason||'').trim()){notify('اختر الصنف واكتب كمية وسبباً صالحين');return;}const item=state.inventory.find(function(x){return x.code===p.code;});if(!item){notify('الصنف غير موجود');return;}if(p.direction==='out'&&qty(item)<Number(p.quantity)){notify('الرصيد لا يكفي للصرف');return;}requestAction({kind:'stock.adjust',summary:(p.direction==='in'?'إضافة':'صرف')+' '+p.quantity+' '+item.unit+' من الصنف '+item.name+'، السبب: '+p.reason+'.',payload:p});return;}
 if(type==='worker-add'){if(!p.name.trim()||!p.code.trim()){notify('الاسم والكود مطلوبان');return;}if(Number(p.dailyRate||0)<0){notify('الأجر لا يمكن أن يكون سالباً');return;}requestAction({kind:'worker.add',summary:'تسجيل العامل '+p.name+' بالكود '+p.code+'، الوظيفة '+(p.job||'غير محدد')+'، الأجر اليومي '+money(p.dailyRate||0)+'.',payload:p});return;}
 if(type==='finance-add'){if(!p.description.trim()||!Number.isFinite(Number(p.amount))||Number(p.amount)<=0){notify('الوصف والمبلغ الموجب مطلوبان');return;}requestAction({kind:'finance.add',summary:'تسجيل '+p.type+' بقيمة '+money(p.amount)+'، الوصف '+p.description+'، التاريخ '+p.date+'.',payload:p});return;}
 if(type==='profile-update'){requestAction({kind:'profile.update',summary:'تحديث البيانات الوصفية للمزرعة. راجع القيم قبل الحفظ.',payload:p});return;}
}
function exportBackup(){try{const blob=new Blob([JSON.stringify({format:'balegh-web-local-backup',version:4,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='balegh-web-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notify('تم تجهيز النسخة الاحتياطية');}catch(e){notify('تعذر تصدير النسخة الاحتياطية في هذا المتصفح');}}
function toggleVoice(){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(listening){try{recognition&&recognition.stop();}catch(e){}listening=false;render();return;}if(!Recognition){reply('التعرف على الكلام غير مدعوم في هذا المتصفح. استخدم خانة الكتابة.');return;}try{recognition=new Recognition();recognition.lang='ar-EG';recognition.continuous=false;recognition.interimResults=false;recognition.onstart=function(){listening=true;notify('بليغ يستمع');render();};recognition.onresult=function(e){listening=false;const text=e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:'';if(text)processInput(text);else{notify('لم يتم التقاط كلام واضح');render();}};recognition.onerror=function(e){listening=false;notify('تعذر استخدام الميكروفون: '+(e.error||'خطأ'));render();};recognition.onend=function(){listening=false;render();};recognition.start();}catch(e){listening=false;notify('تعذر بدء التعرف الصوتي');render();}}
root.addEventListener('click',function(event){const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='navigate'){view=button.dataset.view||'home';render();return;}if(action==='confirm-yes'){confirmPending(true);return;}if(action==='confirm-no'){cancelPending();return;}if(action==='skip-onboarding'){skipOnboarding(false);return;}if(action==='finish-onboarding'){skipOnboarding(true);return;}if(action==='toggle-voice'){toggleVoice();return;}if(action==='export'){exportBackup();return;}if(action==='reset'){requestAction({kind:'reset',summary:'سيتم حذف بيانات نسخة الويب المحلية من هذا المتصفح فقط. هذا لا يحذف بيانات تطبيق Android.'});return;}if(action==='toggle-task'){const task=state.tasks.find(function(t){return String(t.id)===String(button.dataset.id);});if(task)requestAction({kind:'task.toggle',summary:(task.status==='مكتملة'?'إعادة فتح':'إكمال')+' المهمة: '+task.taskName+'؟',payload:{id:task.id}});return;}if(action==='attendance'){const worker=workerByCode(button.dataset.code);if(worker)requestAction({kind:'attendance',summary:'تسجيل حضور '+worker.name+' بتاريخ '+today()+'.',payload:{code:worker.code}});}});
root.addEventListener('submit',function(event){const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();submitForm(form);});
if(!state.profile.complete){renderOnboarding();}else{render();}
if(!localStorage.getItem(STORE))save();
})();
</script>
