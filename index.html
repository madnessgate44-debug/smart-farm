<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05090d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>بليغ — تشغيل المزرعة</title>
<style>
:root{--bg:#05090d;--panel:#0b151d;--panel2:#101d26;--line:#20313b;--text:#eef7f4;--muted:#81939c;--green:#18c89b;--amber:#f2b84b;--red:#ef6262;--blue:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -8%,#123b34,#05090d 48%);color:var(--text);font-family:system-ui,Tahoma,Arial,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:16px 14px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0;color:var(--muted);font-size:11px}.status{font-size:10px;border:1px solid #1b6758;background:#0a2722;color:#8ff0d0;border-radius:99px;padding:7px 10px}
.hero{text-align:center;padding:25px 0 12px}.ey{font-size:10px;color:var(--green);letter-spacing:.13em;font-weight:800}.hero h2{font-size:28px;margin:10px 0 5px}.hero p{color:var(--muted);line-height:1.7;margin:0 auto 17px;max-width:500px}
.mic{width:132px;height:132px;border-radius:50%;border:1px solid #24584f;background:radial-gradient(circle,#16473d,#0a1818);color:#fff;font-size:42px;box-shadow:0 0 0 11px #0b1719,0 0 55px #18c89b1e;transition:.2s}.mic.live{border-color:var(--green);background:radial-gradient(circle,#1a9277,#0d342e);animation:pulse 1.25s infinite}@keyframes pulse{50%{transform:scale(1.035)}}
.state{height:25px;margin-top:14px;color:var(--green);font-size:12px}.hint{font-size:10px;color:var(--muted)}
.panel{background:linear-gradient(160deg,#0c161e,#081017);border:1px solid var(--line);border-radius:19px;padding:14px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#0b151d;border:1px solid #182934;border-radius:14px;padding:11px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}
.g{color:var(--green)}.a{color:var(--amber)}.r{color:var(--red)}.b{color:var(--blue)}
.chips{display:flex;gap:7px;overflow:auto;margin:8px 0 13px}.chip,.btn{border:1px solid var(--line);background:#0d1820;color:#dce7e7;border-radius:13px;padding:10px 12px;font-size:11px;white-space:nowrap}.primary{background:#127d68;border-color:#19a889}
.log{display:flex;flex-direction:column;gap:8px}.msg{padding:11px 13px;border-radius:17px;line-height:1.7;font-size:13px;white-space:pre-wrap;max-width:94%}.user{background:#123b34;align-self:flex-start}.bot{background:#0d1820;border:1px solid var(--line);align-self:flex-end}.system{align-self:center;color:var(--muted);font-size:10px}
.trace{border:1px solid var(--line);border-radius:16px;padding:11px;margin:9px 0;background:#081118}.trace div{font-size:11px;padding:6px 0;border-bottom:1px solid #14212a}.trace div:last-child{border:0}
.row{display:flex;gap:7px;align-items:center}.input{flex:1;background:#081118;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;font:inherit;font-size:13px;outline:none}.bottom{display:flex;gap:7px;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%);flex-wrap:wrap}
.small{font-size:10px;color:var(--muted)}details summary{cursor:pointer;color:#dce7e7;font-size:12px}details p{font-size:12px}
.onboard{background:linear-gradient(160deg,#0e201f,#081017);border:1px solid #1c6658;border-radius:20px;padding:18px;margin:12px 0}.onboard h3{margin:0 0 7px}.onboard p{color:var(--muted);font-size:12px;line-height:1.7}.onboard .step{color:var(--green);font-size:10px;font-weight:700}.confirm{border-color:#725c25;background:#1b170c}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="app"><header><div class="brand"><h1>🌾 بليغ</h1><p>العقل التشغيلي للمزرعة</p></div><span class="status" id="status">● جاهز</span></header><main id="main"></main></div>
<script>
const STORE='balegh_personal_v3';
const base={profile:{name:'',farmName:'',location:'',size:'',lands:'',crops:'',livestock:'',workers:'',equipment:'',inventory:'',priorities:'',complete:false},workers:[],inventory:[],tasks:[],finance:[],attendance:[],events:[],memory:[],notes:[]};
let s=JSON.parse(localStorage.getItem(STORE)||'null')||base;
let rec=null,listening=false,auto=false,busy=false,pending=null,trace=[];
const save=()=>localStorage.setItem(STORE,JSON.stringify(s));
const norm=x=>String(x||'').replace(/[إأآ]/g,'ا').replace(/[ى]/g,'ي').replace(/[ة]/g,'ه').toLowerCase().trim();
const has=(x,a)=>a.some(y=>norm(x).includes(norm(y)));
const num=x=>{let m=String(x).replace(/,/g,'').match(/[0-9٠-٩]+(?:\.[0-9٠-٩]+)?/);if(!m)return null;return +m[0].replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))};
const day=()=>new Date().toISOString().slice(0,10);
const tom=()=>{let d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)};
const money=x=>Number(x||0).toLocaleString('ar-EG')+' جنيه';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function event(type,text){s.events.push({type,text,time:Date.now()});s.events=s.events.slice(-120);save()}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.94;speechSynthesis.speak(u)}}
function render(){
 const open=s.tasks.filter(x=>x.status!=='مكتملة').length,low=s.inventory.filter(x=>+x.qty<=+(x.min||0)).length;
 const inc=s.finance.filter(x=>x.type==='دخل').reduce((a,x)=>a+ +x.amount,0),out=s.finance.filter(x=>x.type==='مصروف').reduce((a,x)=>a+ +x.amount,0);
 if(!s.profile.complete){renderOnboarding();return}
 main.innerHTML='<section class="hero"><div class="ey">VOICE-FIRST FARM OPERATING SYSTEM</div><button id="mic" class="mic '+(listening?'live':'')+'" onclick="toggle()">🎙️</button><div class="state">'+(busy?'بليغ ينفذ...':listening?'بليغ يستمع الآن...':'ابدأ التحدث')+'</div><div class="hint">اتكلم مع بليغ بطريقتك الطبيعية. الكتابة موجودة كبديل فقط.</div></section>'+
 '<div class="chips"><button class="chip" onclick="go(\'ايه اهم حاجه محتاجه تدخل النهارده؟\')">أهم شيء اليوم</button><button class="chip" onclick="go(\'ايه اللي ناقص في المخزن؟\')">المخزن</button><button class="chip" onclick="go(\'مين حضر النهارده؟\')">الحضور</button><button class="chip" onclick="go(\'ايه وضع الفلوس؟\')">المالية</button><button class="chip" onclick="go(\'اعرض مهامي\')">المهام</button></div>'+
 '<div class="panel"><div class="grid"><div class="stat"><b>'+open+'</b><span>مهام مفتوحة</span></div><div class="stat"><b class="g">'+s.tasks.filter(x=>x.status==='مكتملة').length+'</b><span>مكتملة</span></div><div class="stat"><b class="'+(low?'a':'g')+'">'+low+'</b><span>مخزون منخفض</span></div><div class="stat"><b>'+s.workers.length+'</b><span>عمال</span></div></div></div>'+
 (pending?'<div class="panel confirm"><b>تأكيد مطلوب</b><p class="small">'+esc(pending.text)+'</p><div class="row"><button class="btn primary" onclick="confirmAction(\'نعم\')">نعم، نفّذ</button><button class="btn" onclick="confirmAction(\'لا\')">إلغاء</button></div></div>':'')+
 '<div class="trace" style="'+(trace.length?'':'display:none')+'"><b>ماذا فعل بليغ؟</b>'+trace.map(x=>'<div>● '+esc(x)+'</div>').join('')+'</div>'+
 '<div class="log">'+s.events.slice(-10).reverse().map(x=>'<div class="msg '+(x.type==='user'?'user':x.type==='system'?'system':'bot')+'">'+esc(x.text)+'</div>').join('')+'</div>'+
 '<div class="panel"><div class="row"><input id="textInput" class="input" placeholder="اكتب لبليغ إذا لم تستخدم الميكروفون"><button class="btn primary" onclick="sendText()">إرسال</button></div></div>'+
 '<div class="panel"><details><summary>ذاكرة المزرعة</summary><p>المزرعة: <b>'+esc(s.profile.farmName||'غير محدد')+'</b></p><p>الموقع: '+esc(s.profile.location||'غير محدد')+'</p><p>المحاصيل: '+esc(s.profile.crops||'غير محدد')+'</p><p>الأولوية: '+esc(s.profile.priorities||'غير محدد')+'</p><p class="small">بليغ يحتفظ بالحقائق التي تعلمها هنا في هذا المتصفح.</p></details><details><summary>الوضع المالي</summary><p>الدخل <b class="g">'+money(inc)+'</b> — المصروف <b class="r">'+money(out)+'</b> — الصافي <b>'+money(inc-out)+'</b></p></details></div>'+
 '<div class="bottom"><button class="btn primary" onclick="toggle()">'+(listening?'إيقاف الاستماع':'ابدأ التحدث')+'</button><button class="btn" onclick="go(\'ماذا تستطيع أن تفعل؟\')">قدرات بليغ</button><button class="btn" onclick="resetDemo()">إعادة الإعداد</button></div>';
}
function renderOnboarding(){
 const p=s.profile,step=!p.farmName?1:!p.location?2:!p.lands?3:!p.crops?4:!p.workers?5:!p.livestock?6:!p.equipment?7:!p.inventory?8:!p.priorities?9:10;
 main.innerHTML='<section class="onboard"><div class="step">تهيئة بليغ • '+Math.min(step,9)+'/9</div><h3>خليني أتعرف على مزرعتك أولاً</h3><p>ده مش فورم. اتكلم معي بشكل طبيعي. سأحفظ ما تقوله، ولن أطلب نفس المعلومة مرة أخرى.</p><button class="btn primary" onclick="startOnboardVoice()">🎙️ ابدأ المحادثة</button><p class="small">أو اكتب إجابتك في الأسفل.</p></section><div class="log">'+s.events.slice(-8).reverse().map(x=>'<div class="msg '+(x.type==='user'?'user':'bot')+'">'+esc(x.text)+'</div>').join('')+'</div><div class="panel"><div class="row"><input id="textInput" class="input" placeholder="اكتب إجابتك لبليغ"><button class="btn primary" onclick="sendText()">إرسال</button></div></div>';
 if(step<=9&&!s.events.some(x=>x.type==='bot'&&x.text.includes(onboardQuestion(step))))setTimeout(()=>{let q=onboardQuestion(step);event('bot',q);render();speak(q)},100);
}
function onboardQuestion(step){return ['','اسمك إيه؟','اسم المزرعة أو اسم المكان إيه؟','المزرعة فين؟','تقريباً كام أرض أو حقل عندك؟','إيه المحاصيل الأساسية؟','عندك عمال؟ كام واحد تقريباً؟','فيه حيوانات أو مواشي؟','إيه المعدات أو الآلات المهمة عندك؟','إيه أهم أصناف المخزن أو الاحتياجات اللي لازم أتابعها؟'][step]||'إيه أهم حاجة تحب بليغ يركز عليها في إدارة المزرعة؟'}
function startOnboardVoice(){auto=false;start()}
function handleOnboard(t){
 const p=s.profile, step=!p.name?1:!p.farmName?2:!p.location?3:!p.lands?4:!p.crops?5:!p.workers?6:!p.livestock?7:!p.equipment?8:!p.inventory?9:10;
 if(step===1)p.name=t.trim(); else if(step===2)p.farmName=t.trim(); else if(step===3)p.location=t.trim(); else if(step===4)p.lands=t.trim(); else if(step===5)p.crops=t.trim(); else if(step===6){p.workers=t.trim();let q=num(t);if(q){s.workers=[];for(let i=1;i<=q;i++)s.workers.push({code:'W'+String(i).padStart(2,'0'),name:'عامل '+i,job:'عامل'})}} else if(step===7)p.livestock=t.trim(); else if(step===8)p.equipment=t.trim(); else if(step===9)p.inventory=t.trim(); else p.priorities=t.trim();
 s.memory.push({key:['owner','farm','location','lands','crops','workers','livestock','equipment','inventory','priorities'][step-1],value:t,date:Date.now()});
 if(step===10)p.complete=true;save();
 if(p.complete){event('bot','تم. عرفت الأساسيات عن مزرعتك. من الآن اتكلم معي كمديرك التشغيلي.');speak('تم. عرفت الأساسيات عن مزرعتك. اتكلم معي بشكل طبيعي.');render()}
 else {event('user',t);render()}
}
function matchesWorker(t){return s.workers.filter(w=>norm(t).includes(norm(w.name)))}
function matchesItem(t){return s.inventory.filter(x=>norm(t).includes(norm(x.name))||norm(t).includes(norm(x.category||'')))}
function process(t){
 if(!t||busy)return;event('user',t);if(!s.profile.complete){handleOnboard(t);return}
 busy=true;status.textContent='● يفهم';render();setTimeout(()=>{let r=route(t);busy=false;trace=r.trace||[];if(r.reply)reply(r.reply);if(auto&&!listening)setTimeout(start,650)},180)
}
function reply(t){event('bot',t);render();status.textContent='● جاهز';speak(t)}
function route(t){
 const n=norm(t);
 if(pending)return confirmAction(t);
 if(has(n,['ماذا تستطيع','ايه تقدر','قدرات بليغ']))return {reply:'أقدر أتابع العمال والمخزون والمهام والحضور والمالية، أسجل التزاماتك، وأربط الطلب بالمزرعة. لو الطلب غير واضح سأطلب توضيحاً بدل ما أخمّن.',trace:['عرضت القدرات المتاحة.']};
 if(has(n,['اعمل مهمه','سجل مهمه','كلف','نفذ مهمه','اعمل مهمة']))return makeTask(t,n);
 if(has(n,['خلص','انهى','تمت','انجز'])&&s.tasks.some(x=>x.status!=='مكتملة'))return completeTask(t);
 if(has(n,['زود المخزن','اضف للمخزن','استلمنا','وصل المخزون']))return stockIn(t);
 if(has(n,['صرف من المخزن','استخدمنا','سحبنا من المخزن']))return stockOut(t);
 if(has(n,['بعنا','سجل بيع','مبيعات','قبضنا']))return moneyAction('دخل',t);
 if(has(n,['دفعنا','سجل مصروف','مصروف','اشترينا']))return moneyAction('مصروف',t);
 if(has(n,['مين حضر','الحضور','كام عامل','حضر']))return attendance(t);
 if(has(n,['مخزن','مخزون','ناقص','رصيد','سماد','علف']))return inventory();
 if(has(n,['فلوس','مالية','ماليه','ربح','مصروفات','دخل']))return finance();
 if(has(n,['مهام','مهمات','اللي علينا','اعرض مهامي']))return tasks();
 if(has(n,['وعد','قال انه هيجيب','هيجيب','بكره','غدا']))return commitment(t);
 if(has(n,['حالة المزرعة','حال المزرعه','ايه الاخبار','ايه المهم','ملخص']))return overview();
 if(has(n,['مشكله','مشكلة','مش شغال','مش شغاله','مش بينمو','ضعيف','مريض']))return problem(t);
 return {reply:'فاهم إنك بتتكلم عن المزرعة، لكن الطلب غير محدد بما يكفي. قل لي ماذا تريد، وأنا لن أغيّر أي سجل عندما أكون غير متأكد.',trace:['لم أنفذ تغييراً لأن الطلب غير واضح.']}
}
function makeTask(t,n){
 let w=matchesWorker(t);if(w.length>1)return {reply:'عندي أكثر من عامل مطابق: '+w.map(x=>x.name).join('، ')+'. قل لي تقصد مين؟',trace:['وجدت مطابقة متعددة؛ توقفت.']};
 let lm=t.match(/(?:الارض|أرض|حقل|حوض)\s*([0-9٠-٩]+)/i),land=lm?lm[1]:'';
 let due=has(n,['بكره','غدا','غداً'])?tom():day(),title=t.replace(/اعمل مهمه|سجل مهمه|كلف|نفذ مهمه/gi,' ').replace(/بكره|غدا|غداً/gi,'').trim();
 let x={id:Date.now(),title:title||'مهمة تشغيلية',assignee:w[0]?.name||'',workerCode:w[0]?.code||'',land,due,status:'مفتوحة',progress:0};
 s.tasks.push(x);event('action','إنشاء مهمة: '+x.title);save();return {reply:'تم. سجلت المهمة'+(w.length?' لـ '+w[0].name:'')+(land?' على الأرض '+land:'')+(due===tom()?' لبكرة':' لليوم')+'.',trace:['فهمت الطلب كتعليمات تشغيل.','تحققت من البيانات المتاحة.','أنشأت المهمة وحفظتها.']}
}
function completeTask(t){let a=s.tasks.filter(x=>x.status!=='مكتملة'),w=matchesWorker(t);if(w.length===1)a=a.filter(x=>norm(x.assignee||'')===norm(w[0].name));if(a.length!==1)return {reply:a.length?'عندي أكثر من مهمة مفتوحة. قل لي اسم المهمة أو العامل.':'مش لاقي مهمة مفتوحة مناسبة.',trace:['لم أغيّر أي مهمة لأن المطابقة غير مؤكدة.']};a[0].status='مكتملة';a[0].progress=100;event('action','إكمال مهمة: '+a[0].title);save();return {reply:'تم. أغلقت مهمة «'+a[0].title+'» كمكتملة.',trace:['وجدت المهمة.','غيّرت الحالة.','حفظت التغيير.']}}
function stockIn(t){let a=matchesItem(t),q=num(t);if(a.length!==1)return {reply:a.length?'عندي أكثر من صنف مطابق.':'مش لاقي الصنف في المخزن.',trace:['لم أحدد صنفاً واحداً.']};if(!q)return {reply:'محتاج الكمية.',trace:['الكمية غير موجودة.']};a[0].qty=+a[0].qty+q;event('action','إضافة '+q+' '+a[0].name);save();return {reply:'تم. أضفت '+q+' إلى '+a[0].name+'. الرصيد الآن '+a[0].qty+'.',trace:['وجدت الصنف.','أضفت الكمية.','حفظت الرصيد.']}}
function stockOut(t){let a=matchesItem(t),q=num(t);if(a.length!==1)return {reply:'لم أحدد صنفاً واحداً في المخزن.',trace:['توقفت قبل التنفيذ.']};if(!q)return {reply:'محتاج كمية الصرف.',trace:['الكمية غير موجودة.']};if(+a[0].qty<q)return {reply:'لن أصرفها. الرصيد الحالي '+a[0].qty+' فقط.',trace:['الرصيد غير كافٍ؛ لم أغيّر البيانات.']};a[0].qty-=q;event('action','صرف '+q+' '+a[0].name);save();return {reply:'تم صرف '+q+' من '+a[0].name+'. المتبقي '+a[0].qty+'.',trace:['تحققت من الرصيد.','نفذت الصرف.','حفظت الرصيد.']}}
function moneyAction(type,t){let q=num(t);if(!q)return {reply:'محتاج المبلغ.',trace:['لم أسجل حركة مالية بدون مبلغ.']};pending={kind:'finance',type,amount:q,text:'هسجل '+type+' بقيمة '+money(q)+'.'};render();return {reply:'هسجل '+type+' بقيمة '+money(q)+'. أكّد من زر التأكيد أو قل نعم.',trace:['جهزت العملية.','التغيير المالي يحتاج تأكيداً.']}}
function confirmAction(t){if(has(t,['نعم','ايوه','أيوه','اه','نفذ'])){let p=pending;pending=null;if(p.kind==='finance'){s.finance.push({type:p.type,amount:p.amount,note:'عن طريق بليغ',date:day()});event('action','تسجيل '+p.type+' '+money(p.amount));save();return {reply:'تم. سجلت '+p.type+' بقيمة '+money(p.amount)+'.',trace:['تحققت من التأكيد.','نفذت الحركة المالية.','حفظت التغيير.']}}}if(has(t,['لا','الغاء','إلغاء','مش'])){pending=null;return {reply:'تمام. لم أغيّر البيانات.',trace:['ألغيت العملية.']}}return {reply:'أحتاج «نعم» أو «لا».',trace:['العملية ما زالت معلقة.']}}
function attendance(t){let w=matchesWorker(t);if(w.length===1){if(!s.attendance.some(x=>x.date===day()&&x.name===w[0].name)){s.attendance.push({date:day(),name:w[0].name});event('action','حضور '+w[0].name);save();return {reply:'تم تسجيل حضور '+w[0].name+'.',trace:['حددت العامل.','سجلت الحضور.']}}return {reply:w[0].name+' مسجل بالفعل كحاضر.',trace:['وجدت تسجيل الحضور.']}}let a=s.attendance.filter(x=>x.date===day()).map(x=>x.name);return {reply:a.length?'الحاضرون اليوم: '+a.join('، ')+'.':'لا يوجد حضور مسجل اليوم.',trace:['راجعت سجل الحضور.']}}
function inventory(){let a=s.inventory.filter(x=>+x.qty<=+(x.min||0));return {reply:a.length?'عندي '+a.length+' أصناف تحتاج انتباه: '+a.map(x=>x.name+' ('+x.qty+')').join('، ')+'.':'المخزون فوق الحدود الدنيا.',trace:['راجعت المخزون.','فحصت الحدود الدنيا.']}}
function finance(){let i=s.finance.filter(x=>x.type==='دخل').reduce((a,x)=>a+ +x.amount,0),o=s.finance.filter(x=>x.type==='مصروف').reduce((a,x)=>a+ +x.amount,0);return {reply:'الدخل '+money(i)+'، المصروف '+money(o)+'، والصافي '+money(i-o)+'.',trace:['راجعت الحركات المالية.','حسبت الصافي.']}}
function tasks(){let a=s.tasks.filter(x=>x.status!=='مكتملة');return {reply:a.length?'عندك '+a.length+' مهام مفتوحة: '+a.slice(0,6).map(x=>x.title+(x.assignee?' مع '+x.assignee:'')).join('، ')+'.':'مفيش مهام مفتوحة.',trace:['راجعت قائمة المهام.']}}
function commitment(t){let q=has(t,['بكره','غدا','غداً'])?'غداً':'موعد غير محدد';s.notes.push({text:t,due:q,created:Date.now()});event('action','حفظ التزام: '+t);save();return {reply:'حفظت الالتزام في ذاكرة بليغ: «'+t+'». الموعد: '+q+'. لن أعتبره شراءً أو تنفيذًا تلقائياً.',trace:['استخرجت الالتزام.','حفظته كذاكرة تشغيلية.','لم أنفذ شراءً أو حركة مالية.']}}
function problem(t){s.notes.push({text:'مشكلة: '+t,created:Date.now()});event('action','تسجيل مشكلة: '+t);save();return {reply:'سجلت المشكلة كبلاغ تشغيلي: «'+t+'». محتاج تفاصيل أكثر عن الأرض أو المحصول لو عايز نحللها، ولن أخترع تشخيصاً من غير بيانات.',trace:['سجلت البلاغ.','لم أختلق تشخيصاً.']}}
function overview(){let a=s.tasks.filter(x=>x.status!=='مكتملة').length,b=s.inventory.filter(x=>+x.qty<=+(x.min||0)).length;return {reply:'ملخص سريع: '+a+' مهام مفتوحة، '+b+' أصناف تحت الحد الأدنى، '+s.workers.length+' عمال مسجلين، و'+s.notes.length+' ملاحظات أو التزامات.',trace:['راجعت المهام.','راجعت المخزون.','راجعت العمال والذاكرة.']}}
function start(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){event('system','التعرف الصوتي غير مدعوم في هذا المتصفح. استخدم Chrome على الهاتف.');render();return}
 if(listening)return;rec=new SR();rec.lang='ar-EG';rec.interimResults=false;rec.continuous=false;
 rec.onstart=()=>{listening=true;status.textContent='● يستمع الآن';render()};
 rec.onresult=e=>process(e.results[0][0].transcript);
 rec.onerror=e=>{listening=false;if(e.error==='not-allowed'){auto=false;event('system','اسمح للمتصفح بالميكروفون مرة واحدة.')}else event('system','تعذر التقاط الكلام: '+e.error);render()};
 rec.onend=()=>{listening=false;if(auto&&!busy)setTimeout(start,500);else{status.textContent='● جاهز';render()}};
 try{rec.start()}catch(e){}
}
function stop(){auto=false;try{rec?.stop()}catch(e){}listening=false;status.textContent='● جاهز';render()}
function toggle(){if(listening)stop();else{auto=true;start()}}
function sendText(){let x=document.getElementById('textInput');if(x&&x.value.trim()){let t=x.value.trim();x.value='';process(t)}}
function go(t){process(t)}
function startOnboardVoice(){auto=true;start()}
function resetDemo(){if(confirm('مسح ذاكرة بليغ المحلية وإعادة محادثة التعريف؟')){localStorage.removeItem(STORE);location.reload()}}
render();
</script></body></html>
