<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05090d"><title>بليغ — تشغيل المزرعة</title><style>
:root{--bg:#05090d;--p:#0b151d;--p2:#101d26;--l:#1c2d37;--t:#eef7f4;--m:#82949d;--g:#18c89b;--a:#f2b84b;--r:#ef6262}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12342e,#05090d 50%);color:var(--t);font-family:system-ui,Tahoma,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header p{margin:4px 0;color:var(--m);font-size:11px}.status{font-size:10px;color:#8ff0d0;border:1px solid #1b6758;background:#0a2722;border-radius:99px;padding:6px 9px}.hero{text-align:center;padding:30px 0 18px}.ey{font-size:10px;color:var(--g);letter-spacing:.14em;font-weight:700}.hero h2{font-size:29px;margin:12px 0 7px}.hero p{color:var(--m);line-height:1.7}.mic{width:132px;height:132px;border-radius:50%;border:1px solid #24584f;background:radial-gradient(circle,#16473d,#0a1818);color:white;font-size:43px;box-shadow:0 0 0 12px #0b1719,0 0 60px #18c89b20}.mic.live{border-color:var(--g);background:radial-gradient(circle,#1a9277,#0d342e);animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(1.04)}}.state{height:24px;margin-top:15px;color:var(--g);font-size:12px}.hint{font-size:10px;color:var(--m)}.chips{display:flex;gap:7px;overflow:auto;margin:8px 0 13px}.chip,.btn{border:1px solid var(--l);background:#0d1820;color:#dce7e7;border-radius:13px;padding:10px 12px;font-size:11px;white-space:nowrap}.primary{background:#127d68;border-color:#19a889}.panel{background:linear-gradient(160deg,#0c161e,#081017);border:1px solid var(--l);border-radius:20px;padding:14px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#0b151d;border:1px solid #182934;border-radius:14px;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--m)}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}.log{display:flex;flex-direction:column;gap:8px}.msg{padding:11px 13px;border-radius:17px;line-height:1.7;font-size:13px;white-space:pre-wrap;max-width:92%}.user{background:#123b34;align-self:flex-start}.bot{background:#0d1820;border:1px solid var(--l);align-self:flex-end}.system{align-self:center;color:var(--m);font-size:10px}.trace{border:1px solid var(--l);border-radius:16px;padding:11px;margin:9px 0;background:#081118}.trace div{font-size:11px;padding:6px 0;border-bottom:1px solid #14212a}.trace div:last-child{border:0}.bottom{display:flex;gap:7px;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header><div><h1>🌾 بليغ</h1><p>العقل التشغيلي للمزرعة</p></div><span class="status" id="status">● جاهز</span></header><main id="main"></main></div><script>
const KEY='smartfarm_balegh_v1',old=JSON.parse(localStorage.getItem('smartfarm_web_v2')||'null');
const s=JSON.parse(localStorage.getItem(KEY)||'null')||{workers:old?.workers||[],inventory:old?.inventory||[],tasks:old?.tasks||[],finance:old?.finance||[],attendance:[],events:[]};
let rec=null,listening=false,auto=false,busy=false,pending=null,trace=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(s)),norm=x=>String(x||'').replace(/[إأآ]/g,'ا').replace(/[ى]/g,'ي').replace(/[ة]/g,'ه').toLowerCase().trim(),has=(x,a)=>a.some(y=>norm(x).includes(norm(y))),num=x=>{let m=String(x).match(/\d+(?:\.\d+)?/);return m?+m[0]:null},money=x=>Number(x||0).toLocaleString('ar-EG')+' جنيه',day=()=>new Date().toISOString().slice(0,10),tom=()=>{let d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ev(type,text){s.events.push({type,text,time:Date.now()});s.events=s.events.slice(-100);save()}
function say(text){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ar-EG';u.rate=.95;speechSynthesis.speak(u)}}
function render(){let open=s.tasks.filter(x=>x.status!=='مكتملة').length,low=s.inventory.filter(x=>+x.qty<=+(x.min||0)).length,inc=s.finance.filter(x=>x.type==='دخل').reduce((a,x)=>a+ +x.amount,0),out=s.finance.filter(x=>x.type==='مصروف').reduce((a,x)=>a+ +x.amount,0);main.innerHTML='<section class="hero"><div class="ey">VOICE-FIRST FARM OPERATING SYSTEM</div><button id="mic" class="mic '+(listening?'live':'')+'" onclick="toggle()">🎙️</button><div class="state">'+(busy?'بليغ ينفذ...':listening?'بليغ يستمع الآن...':'ابدأ وضع التحدث')+'</div><div class="hint">بعد التشغيل، تكلم مع بليغ بشكل طبيعي. لا تحتاج للكتابة.</div></section><div class="chips"><button class="chip" onclick="go(\'ما أهم حاجة محتاجة تدخل النهاردة؟\')">أهم شيء اليوم</button><button class="chip" onclick="go(\'إيه اللي ناقص في المخزن؟\')">المخزن</button><button class="chip" onclick="go(\'كام عامل حضر النهاردة؟\')">الحضور</button><button class="chip" onclick="go(\'إيه وضع الفلوس؟\')">المالية</button></div><div class="panel"><div class="grid"><div class="stat"><b>'+open+'</b><span>مهام مفتوحة</span></div><div class="stat"><b class="g">'+s.tasks.filter(x=>x.status==='مكتملة').length+'</b><span>مكتملة</span></div><div class="stat"><b class="'+(low?'a':'g')+'">'+low+'</b><span>مخزون منخفض</span></div><div class="stat"><b>'+s.workers.length+'</b><span>عمال</span></div></div></div><div class="trace" style="'+(trace.length?'':'display:none')+'"><b>ماذا فعل بليغ؟</b>'+trace.map(x=>'<div>● '+esc(x)+'</div>').join('')+'</div><div class="log">'+s.events.slice(-8).reverse().map(x=>'<div class="msg '+(x.type==='user'?'user':x.type==='system'?'system':'bot')+'">'+esc(x.text)+'</div>').join('')+'</div><div class="panel"><details><summary>حالة المزرعة</summary><p>الدخل <b class="g">'+money(inc)+'</b></p><p>المصروف <b class="r">'+money(out)+'</b></p><p>الصافي <b>'+money(inc-out)+'</b></p></details></div><div class="bottom"><button class="btn primary" onclick="toggle()">'+(listening?'إيقاف الاستماع':'ابدأ التحدث')+'</button><button class="btn" onclick="go(\'ماذا تستطيع أن تفعل؟\')">قدرات بليغ</button><button class="btn" onclick="demo()">بيانات تجريبية</button></div>'}
function reply(text){ev('bot',text);render();status.textContent='● جاهز';say(text)}
function matchesWorker(t){return s.workers.filter(w=>norm(t).includes(norm(w.name)))}
function matchesItem(t){return s.inventory.filter(x=>norm(t).includes(norm(x.name))||norm(t).includes(norm(x.category||'')))}
function process(text){if(!text||busy)return;ev('user',text);busy=true;status.textContent='● يفهم';render();setTimeout(()=>{let r=route(text);busy=false;trace=r.trace||[];if(r.reply)reply(r.reply);if(auto&&!listening)setTimeout(start,700)},250)}
function route(t){let n=norm(t);
 if(pending)return confirmAction(t);
 if(has(n,['اعمل مهمه','سجل مهمه','كلف','نفذ مهمه']))return makeTask(t,n);
 if(has(n,['خلص','انهى','تمت','انجز'])&&s.tasks.some(x=>x.status!=='مكتملة'))return completeTask(t);
 if(has(n,['زود المخزن','اضف للمخزن','استلمنا','وصل المخزون']))return stockIn(t);
 if(has(n,['صرف من المخزن','استخدمنا','سحبنا من المخزن']))return stockOut(t);
 if(has(n,['بعنا','سجل بيع','مبيعات','قبضنا']))return moneyAction('دخل',t);
 if(has(n,['دفعنا','سجل مصروف','مصروف','اشترينا']))return moneyAction('مصروف',t);
 if(has(n,['مين حضر','الحضور','كام عامل','حضر']))return attendance(t);
 if(has(n,['مخزن','مخزون','ناقص','رصيد','سماد','علف']))return inventory();
 if(has(n,['فلوس','مالية','ماليه','ربح','مصروفات','دخل']))return finance();
 if(has(n,['مهام','مهمات','اللي علينا']))return tasks();
 if(has(n,['حالة المزرعة','حال المزرعه','ايه الاخبار','ايه المهم']))return overview();
 return {reply:'فاهم إنك بتتكلم عن المزرعة، لكن الطلب غير محدد. قل لي ما تريد عمله وسأنفذه من بيانات المزرعة، بدون كتابة.',trace:['لم أنفذ أي تغيير لأن الطلب غير واضح.']}}
function makeTask(t,n){let w=matchesWorker(t);if(w.length>1)return {reply:'عندي أكثر من عامل بنفس الاسم: '+w.map(x=>x.name).join('، ')+'. قل لي تقصد مين؟',trace:['وجدت أسماء متعددة؛ توقفت قبل التنفيذ.']};if(has(n,['كلف'])&&!w.length)return {reply:'محتاج اسم العامل. العمال المسجلون: '+(s.workers.map(x=>x.name).join('، ')||'لا يوجد عمال')+'.',trace:['لم أحدد عاملاً مؤكداً.']};let lm=t.match(/(?:الارض|أرض|حقل|حوض)\s*([0-9٠-٩]+)/i),land=lm?lm[1]:'',due=has(n,['بكره','غدا','غداً'])?tom():day(),title=t.replace(/اعمل مهمه|سجل مهمه|كلف|نفذ مهمه/gi,' ').replace(/بكره|غدا|غداً/gi,'').trim();let x={id:Date.now(),title:title||'مهمة تشغيلية',assignee:w[0]?.name||'',workerCode:w[0]?.code||'',land,due,status:'مفتوحة',progress:0};s.tasks.push(x);ev('action','إنشاء مهمة: '+x.title);return {reply:'تم. سجلت المهمة'+(w.length?' لـ '+w[0].name:'')+(land?' على الأرض '+land:'')+(due===tom()?' لبكرة':' لليوم')+'.',trace:['فهمت الطلب كتعليمات تشغيل.','تحققت من العامل والأرض.','أنشأت المهمة في سجل المزرعة.']}}
function completeTask(t){let w=matchesWorker(t),a=s.tasks.filter(x=>x.status!=='مكتملة');if(w.length===1)a=a.filter(x=>norm(x.assignee||'')===norm(w[0].name));if(a.length!==1)return {reply:a.length?'عندي أكثر من مهمة مفتوحة. قل لي اسم المهمة أو العامل.':'مش لاقي مهمة مفتوحة مناسبة.',trace:['لم أغيّر أي مهمة لأن المطابقة غير مؤكدة.']};a[0].status='مكتملة';a[0].progress=100;ev('action','إكمال مهمة: '+a[0].title);return {reply:'تم. أغلقت مهمة «'+a[0].title+'» كمكتملة.',trace:['وجدت المهمة.','غيّرت الحالة إلى مكتملة.','حفظت التغيير.']}}
function stockIn(t){let a=matchesItem(t),q=num(t);if(a.length!==1)return {reply:a.length?'عندي أكثر من صنف مطابق.':'مش لاقي الصنف في المخزن.',trace:['لم أحدد صنفاً واحداً.']};if(!q)return {reply:'محتاج الكمية.',trace:['الكمية غير موجودة.']};a[0].qty=+a[0].qty+q;ev('action','إضافة '+q+' '+a[0].name);return {reply:'تم. أضفت '+q+' إلى '+a[0].name+'. الرصيد الآن '+a[0].qty+'.',trace:['وجدت الصنف.','أضفت الكمية.','حفظت الرصيد الجديد.']}}
function stockOut(t){let a=matchesItem(t),q=num(t);if(a.length!==1)return {reply:'لم أحدد صنفاً واحداً في المخزن.',trace:['توقفت قبل التنفيذ.']};if(!q)return {reply:'محتاج كمية الصرف.',trace:['الكمية غير موجودة.']};if(+a[0].qty<q)return {reply:'لن أصرفها. الرصيد الحالي '+a[0].qty+' فقط.',trace:['الرصيد غير كافٍ؛ لم أغيّر البيانات.']};a[0].qty-=q;ev('action','صرف '+q+' '+a[0].name);return {reply:'تم صرف '+q+' من '+a[0].name+'. المتبقي '+a[0].qty+'.',trace:['تحققت من الرصيد.','نفذت الصرف.','حفظت الرصيد الجديد.']}}
function moneyAction(type,t){let q=num(t);if(!q)return {reply:'محتاج المبلغ.',trace:['لم أسجل حركة مالية بدون مبلغ.']};pending={type,amount:q};return {reply:'هسجل '+type+' بقيمة '+money(q)+'. قل «نعم» للتنفيذ أو «لا» للإلغاء.',trace:['جهزت العملية.','التغيير المالي يحتاج تأكيداً.']}}
function confirmAction(t){if(has(t,['نعم','ايوه','أيوه','اه','نفذ'])){let p=pending;pending=null;s.finance.push({type:p.type,amount:p.amount,note:'عن طريق بليغ',date:day()});ev('action','تسجيل '+p.type+' '+money(p.amount));return {reply:'تم. سجلت '+p.type+' بقيمة '+money(p.amount)+'.',trace:['تحققت من التأكيد.','نفذت الحركة المالية.','حفظت التغيير.']}}if(has(t,['لا','الغاء','إلغاء','مش'])){pending=null;return {reply:'تمام. لم أغيّر البيانات.',trace:['ألغيت العملية.']}}return {reply:'أحتاج «نعم» أو «لا» لإتمام العملية المالية.',trace:['العملية ما زالت معلقة.']}}
function attendance(t){if(has(t,['مين حضر','الحضور','كام عامل'])){let a=s.attendance.filter(x=>x.date===day()).map(x=>x.name);return {reply:a.length?'الحاضرون: '+a.join('، ')+'.':'لا يوجد حضور مسجل اليوم.',trace:['راجعت سجل الحضور.']}}let w=matchesWorker(t);if(w.length!==1)return {reply:'قل لي اسم العامل الذي حضر.',trace:['لم أحدد عاملاً واحداً.']};if(!s.attendance.some(x=>x.date===day()&&x.name===w[0].name)){s.attendance.push({date:day(),name:w[0].name});ev('action','حضور '+w[0].name);return {reply:'تم تسجيل حضور '+w[0].name+'.',trace:['حددت العامل.','سجلت الحضور.']}}return {reply:w[0].name+' مسجل بالفعل كحاضر.',trace:['وجدت تسجيل الحضور.']}}
function inventory(){let a=s.inventory.filter(x=>+x.qty<=+(x.min||0));return {reply:a.length?'عندي '+a.length+' أصناف ناقصة: '+a.map(x=>x.name+' ('+x.qty+')').join('، ')+'.':'المخزون فوق الحدود الدنيا.',trace:['راجعت كل المخزون.','فحصت الحدود الدنيا.']}}
function finance(){let i=s.finance.filter(x=>x.type==='دخل').reduce((a,x)=>a+ +x.amount,0),o=s.finance.filter(x=>x.type==='مصروف').reduce((a,x)=>a+ +x.amount,0);return {reply:'الدخل '+money(i)+'، المصروف '+money(o)+'، والصافي '+money(i-o)+'.',trace:['راجعت الحركات المالية.','حسبت الصافي.']}}
function tasks(){let a=s.tasks.filter(x=>x.status!=='مكتملة');return {reply:a.length?'عندك '+a.length+' مهام مفتوحة: '+a.slice(0,5).map(x=>x.title+(x.assignee?' مع '+x.assignee:'')).join('، ')+'.':'مفيش مهام مفتوحة.',trace:['راجعت قائمة المهام.']}}
function overview(){let a=s.tasks.filter(x=>x.status!=='مكتملة').length,b=s.inventory.filter(x=>+x.qty<=+(x.min||0)).length;return {reply:'عندك '+a+' مهام مفتوحة، و'+b+' أصناف تحتاج انتباه، و'+s.workers.length+' عمال مسجلين.',trace:['راجعت المهام.','راجعت المخزون.','راجعت العمال.']}}
function start(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){ev('system','التعرف الصوتي غير مدعوم. استخدم Chrome.');render();return}if(listening)return;rec=new SR();rec.lang='ar-EG';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{listening=true;status.textContent='● يستمع الآن';render()};rec.onresult=e=>process(e.results[0][0].transcript);rec.onerror=e=>{listening=false;if(e.error==='not-allowed'){auto=false;ev('system','اسمح للمتصفح بالوصول إلى الميكروفون مرة واحدة.')}render()};rec.onend=()=>{listening=false;if(auto&&!busy)setTimeout(start,500);else{status.textContent='● جاهز';render()}};try{rec.start()}catch(e){}}
function stop(){auto=false;try{rec?.stop()}catch(e){}listening=false;status.textContent='● جاهز';render()}
function toggle(){if(listening)stop();else{auto=true;start()}}
function go(t){process(t)}
function demo(){if(!confirm('إنشاء بيانات تجريبية محلية لاختبار بليغ؟'))return;s.workers=[{code:'W01',name:'محمد حسن',job:'عامل ري'},{code:'W02',name:'علي محمود',job:'عامل زراعة'}];s.inventory=[{name:'سماد يوريا',category:'سماد',qty:120,min:150,unit:'كجم'},{name:'علف مواشي',category:'علف',qty:300,min:100,unit:'كجم'}];s.tasks=[];s.finance=[];s.attendance=[];s.events=[];save();render();say('جهزت بيانات تجريبية. شغل وضع التحدث وكلمني بشكل طبيعي.')}
render();
</script></body></html>
